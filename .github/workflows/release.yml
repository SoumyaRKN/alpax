name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ────────────────────────────────────────────────
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: alpax

          # ── macOS arm64 (Apple Silicon M1/M2/M3) [temporarily paused] ───
          # - name: macos-arm64
          #   os: macos-14
          #   target: aarch64-apple-darwin
          #   binary: alpax

          # ── macOS x86_64 (Intel) [temporarily paused] ───────────────────
          # - name: macos-x86_64
          #   os: macos-13
          #   target: x86_64-apple-darwin
          #   binary: alpax

          # ── Windows x86_64 [temporarily paused] ─────────────────────────
          # - name: windows-x86_64
          #   os: windows-2022
          #   target: x86_64-pc-windows-msvc
          #   binary: alpax.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── System dependencies ─────────────────────────────────────────────
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      # ── Download official Microsoft ONNX Runtime 1.18.1 for macOS ───────
      # Fixes parcel.pyke.io 404 for msort_static by pointing ort-sys to official binaries
      - name: Setup ONNX Runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ORT_VER="1.18.1"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ARCH="arm64"
          else
            ARCH="x64"
          fi
          curl -sLO "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-osx-${ARCH}-${ORT_VER}.tgz"
          tar -xzf "onnxruntime-osx-${ARCH}-${ORT_VER}.tgz"
          ORT_DIR="$PWD/onnxruntime-osx-${ARCH}-${ORT_VER}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$ORT_DIR/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # ── Download official Microsoft ONNX Runtime 1.18.1 for Windows ─────
      # Fixes parcel.pyke.io 404 for msort_static on Windows MSVC
      - name: Setup ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ortVer = "1.18.1"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$ortVer/onnxruntime-win-x64-$ortVer.zip" -OutFile "onnxruntime.zip"
          Expand-Archive -Path "onnxruntime.zip" -DestinationPath "."
          $ortDir = (Get-Item "onnxruntime-win-x64-$ortVer").FullName
          "ORT_LIB_LOCATION=$ortDir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$ortDir\lib" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ── Cargo cache ─────────────────────────────────────────────────────
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # ── lance recursion_limit patch (Linux/macOS) ───────────────────────
      # Unpack crates with cargo check first, then inject recursion_limit to lance
      - name: Patch lance recursion limit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo check --target ${{ matrix.target }} || true
          for LANCE_LIB in $(find ~/.cargo/registry/src -name "lib.rs" -path "*/lance-[0-9]*/src/lib.rs" 2>/dev/null); do
            if [ -f "$LANCE_LIB" ] && ! grep -q "recursion_limit" "$LANCE_LIB"; then
              sed -i.bak '1s/^/#![recursion_limit = "512"]\n/' "$LANCE_LIB"
              echo "Patched recursion_limit in $LANCE_LIB"
            fi
          done

      - name: Patch lance recursion limit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo check --target ${{ matrix.target }} 2>$null
          Get-ChildItem -Recurse -Path "$env:USERPROFILE\.cargo\registry\src" -Filter "lib.rs" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'lance-\d.*src[\\/]lib\.rs$' } |
            ForEach-Object {
              if (-not (Select-String -Path $_.FullName -Pattern "recursion_limit" -Quiet -ErrorAction SilentlyContinue)) {
                $content = Get-Content $_.FullName -Raw
                Set-Content $_.FullName -Value ('#![recursion_limit = "512"]' + "`n" + $content)
                Write-Host "Patched $($_.FullName)"
              }
            }

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          PROTOC: protoc

      # ── Package (Linux / macOS) → .tar.gz ──────────────────────────────
      # The archive contains ONLY the binary.
      # The install script is fetched directly from the raw GitHub URL by
      # the user's curl one-liner — no need to bundle it.
      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE="alpax-${{ github.ref_name }}-${{ matrix.name }}.tar.gz"
          tar czf "${ARCHIVE}" \
              -C "target/${{ matrix.target }}/release" alpax
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      # ── Package (Windows) → .zip ────────────────────────────────────────
      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "alpax-${{ github.ref_name }}-${{ matrix.name }}.zip"
          Compress-Archive `
              -Path "target\${{ matrix.target }}\release\alpax.exe" `
              -DestinationPath $archive
          echo "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── SHA-256 checksum ─────────────────────────────────────────────────
      - name: Compute checksum (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: sha256sum "${{ env.ARCHIVE }}" > "${{ env.ARCHIVE }}.sha256"

      - name: Compute checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash "${{ env.ARCHIVE }}" -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ env.ARCHIVE }}" | Out-File -FilePath "${{ env.ARCHIVE }}.sha256"

      # ── Publish to GitHub Release ────────────────────────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── After all platform builds succeed, post the install one-liners ────────
  announce:
    name: Post install instructions
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Update release body with install one-liners
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |

            ---

            ## ⚡ One-line Install

            **Linux / macOS** (paste in any terminal):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```

            **Windows** (paste in PowerShell):
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
            ```

            The installer automatically:
            - Detects your OS & CPU architecture
            - Downloads the correct binary above
            - Asks you a few optional config questions (press Enter for defaults)
            - Downloads the AI embedding model (~22 MB) once
            - Scans for all installed AI coding agents and wires them up

            > Verify your download: each asset has a matching `.sha256` checksum file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
